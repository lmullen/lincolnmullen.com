# Lints only the social media text in a post's front matter
# (social.bluesky, social.mastodon, social.linkedin). Vale doesn't read these
# fields from Markdown front matter, and the View that reaches them replaces
# linting of the body, so they get their own config. `.vale.ini` covers the
# body, title, and description. Run both with `make vale`.

StylesPath = .vale/styles
MinAlertLevel = suggestion
Vocab = Site

[*.md]
BasedOnStyles = Vale, proselint, Site
View = Social
Vale.Terms = NO
