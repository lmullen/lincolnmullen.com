# Vale proofreads the prose of the site: the Markdown body of posts, pages,
# and digest issues, plus the `title` and `description` front matter fields,
# which Vale reads from Markdown front matter on its own. The `social:` text
# needs a second config, `.vale-social.ini`; run both with `make vale`.
#
# Run `vale sync` once (and after changing `Packages`) to download proselint
# into .vale/styles. Downloaded packages are gitignored; the house style
# (`Site`) and the vocabulary in .vale/styles/config are committed.

StylesPath = .vale/styles
MinAlertLevel = suggestion
Packages = proselint
Vocab = Site

[*.md]
BasedOnStyles = Vale, proselint, Site

# Vale.Terms enforces the capitalization of every vocabulary word, but it
# also fires in code spans and slugs (`pandoc`, `gmu`). Spelling still uses
# the vocabulary.
Vale.Terms = NO

# Skip Hugo shortcodes (on one line or several), image filenames, and
# hyphenated lowercase words. Vale lints every top-level string in the front
# matter, not just title and description, so the last pattern keeps it from
# spell-checking slugs.
TokenIgnores = (\{\{[<%].*?[%>]\}\}), (\b[a-z0-9]+(?:-[a-z0-9]+)+\b), (\b[\w-]+\.(?:jpe?g|png|gif|webp|svg)\b)
BlockIgnores = (?s)(\{\{[<%].*?[%>]\}\})
