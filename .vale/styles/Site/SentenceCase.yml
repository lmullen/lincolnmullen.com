# Headings use sentence case, like post titles. Vale can't tell proper nouns
# from other words, so add recurring ones to `exceptions`.
extends: capitalization
message: "Use sentence case: '%s'."
level: suggestion
scope: heading

match: $sentence
indicators:
  - "?"
  - "!"
exceptions:
  - Working On It
  - American
  - Americans
  - Christian
  - Christianity
  - English
  - God
  - Hugo
  - I
  - R
  - RRCHNM
  - George Mason University
