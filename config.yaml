title: "Lincoln Mullen"

mediaTypes:
  application/feed+json:
    suffixes: ["json"]

outputFormats:
  JSONFeed:
    mediaType: "application/feed+json"
    baseName: "index"
    isPlainText: false
    rel: "alternate"
  SocialFeed:
    mediaType: "application/rss+xml"
    baseName: "index"
    isPlainText: true
    notAlternative: true

permalinks:
  blog: "/:section/:slug/"
  archive: "/:slug/"
  page: "/:section/:slug/"

markup:
  goldmark:
    # Requires Hugo >= 0.148; safe now that the Cloudflare build pins the same
    # Hugo version as local dev (see wrangler.jsonc). Prevents duplicate
    # footnote IDs when several footnoted posts share a list page.
    extensions:
      footnote:
        enableAutoIDPrefix: true
    renderer:
      unsafe: true
    # Resolve relative Markdown link destinations -- [syllabus](foo.pdf) -- against
    # page resources, so they work when the content is rendered somewhere other
    # than the page's own permalink (list pages, feeds). "auto", the default, does
    # nothing on a monolingual site; "fallback" is what activates the embedded
    # hook. Shortcode link= parameters are handled separately, in
    # layouts/partials/resolve-link.html.
    renderHooks:
      link:
        useEmbedded: fallback
  highlight:
    noClasses: false
    lineNos: false
    tabWidth: 2

imaging:
  jpeg:
    quality: 85
  webp:
    quality: 85

params:
  # Site description: RSS/JSON feed channel description and the fallback for
  # meta/OpenGraph descriptions. Must live under params (root-level keys are
  # no longer copied into .Site.Params by current Hugo).
  description: "Lincoln Mullen is a historian of American religion and the nineteenth-century United States."
  # Canonical date formats; reference as site.Params.dateForms.* so display
  # and machine-readable dates stay consistent across templates.
  dateForms:
    long: "2 January 2006" # citations, microformats display, hidden headings
    compact: "2 Jan 2006" # metalines, index rows, rail
    day: "Jan 2" # archive rows, which are grouped under year headings
    machine: "2006-01-02" # <time datetime> attributes for date-only values
    rfc3339: "2006-01-02T15:04:05Z07:00" # full timestamps: microformats, OpenGraph
  blogFeedTitle: "Lincoln Mullen's blog"
  subtitle: "Historian of American religion"
  siteFeedUrl: "/blog/index.xml"
  # Buttondown's hosted signup page for the occasional email of new posts; the
  # site has no embedded form.
  emailSignupUrl: "https://buttondown.com/lmullen"
  # How many of the most recent blog posts the home page shows.
  homePosts: 15
  # "Around the internet" social icons: brand (official colors) | monochrome (--mut)
  iconStyle: brand
  author:
    name: "Lincoln Mullen"
    email: "lincoln@lincolnmullen.com"

# Primary navigation, rendered in the site header and the footer "Site" row.
# The blog lives on the home page, so "Blog" points at the root; the About
# content that used to be the home page is the biography and CV, linked from the
# hero. Email signup is a link to Buttondown's hosted page (emailSignupUrl).
menu:
  main:
    - name: Blog
      url: /
      weight: 10
    - name: Scholarship
      url: /scholarship/
      weight: 20
    - name: Teaching
      url: /courses/
      weight: 30

taxonomies: false

related:
  includeNewer: true
  threshold: 60
  indices:
    - name: tags
      weight: 100
    - name: date
      weight: 10

enableGitInfo: true
timeZone: "America/New_York"

security:
  # Allow HTML files inside page bundles to be assembled as content.
  # The default policy denies text/html; override it to permit all media types.
  allowContent:
    - ".*"
  funcs:
    getenv:
      - ^HUGO_
      - ^BLOG_
