# The courses on the Teaching page (layouts/courses/list.html). The page sorts
# the courses by their latest semester and each course's syllabi newest first,
# so the order here does not matter.
#
# Each course has a `title` and a list of `syllabi`. A syllabus on this site is
# named by its page bundle under content/courses/ (`page: christianity.2026`);
# its term, title, and course number come from the page's front matter. Any
# other syllabus gives its `term` ("Spring 2017") and, if it is online, its
# `url`. Either kind can add a `note` ("with John Turner"), and a `title` when
# that semester's course went by another name than the course's `title`.
#
# A course's description is the first paragraph of the "Course description"
# section of its newest syllabus on this site, so a new syllabus updates it.
# Give a `description` only for a course with no syllabus on the site, and a
# `number` only to override (or, for such a course, supply) the course number.

