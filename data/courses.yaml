- title: Church and State in America
  description: >-
    Two of the most pressing questions about American religion and its public
    role are intertwined: how should religions relate to one another, and how
    should religions relate to the state? In this class you will take up these
    questions by studying the interactions of Protestant, Catholic, Jewish,
    Mormon, and Native American religions with one another and with the federal
    and state governments. You will investigate how law has regulated the public
    sphere and the civil square in which religious interactions take place, but
    also how religious actors have driven those interactions. We will read
    primary and secondary sources about the American Revolution and
    disestablishment, moral reform, temperance, and abolition, polygamy, the
    school system, pacifism, civil rights, and political movements, ranging
    from the late eighteenth to the late twentieth century.
  syllabi:
    - term: Fall 2014
      url: https://files.lincolnmullen.com/syllabi/church-state.2014.pdf

- title: Mapping Boston’s Religions
  number: HIST 144a, Brandeis University
  description: >-
    During the American Revolution and the following decades, the state and
    federal governments cut their financial and constitutional support for
    established churches. Though many at the time predicted the demise of
    Christianity, the result was a flowering of an astonishing diversity of
    religions. In this course you will read the writings of the many individuals
    and groups that lived out their religion in the nineteenth-century United
    States. The centerpiece of this class will be a digital history project:
    you will do your own original research into nineteenth-century sources to
    make a digital map of religion in Boston over the nineteenth century.
  syllabi:
    - term: Spring 2014
      url: https://files.lincolnmullen.com/syllabi/religion-19c-dh.pdf

- title: Religious Pluralism and the American State
  number: UWS 1a, Brandeis University
  description: >-
    Two of the most pressing questions about American religion and its public
    role are intertwined: how should religions relate to one another, and how
    should religions relate to the state? In this class you will take up these
    two questions through the historical analysis of texts about the
    interactions of Protestant, Catholic, Jewish, Mormon, and Native American
    religions with one another and with the federal and state governments. We
    will trace the history of American pluralism, from the fact of diversity in
    the eighteenth century to the idea of pluralism in the twenty-first century.
    Because this is a writing seminar, you will write three essays based on
    primary and secondary sources.
  syllabi:
    - term: Fall 2012
      url: https://files.lincolnmullen.com/syllabi/religious-pluralism.syllabus.2012-fall.pdf
