{{ define "main" }}
<div class="blog-layout">
  <div>
    <h1 class="page-title">{{ .Title }}</h1>
    {{ with .Content }}<div class="bodyprose mb-4">{{ . }}</div>{{ end }}

    {{/* Every post, newest first, as one flat index (see index-row.html). */}}
    <div class="idx-list">
      {{ range where .Site.RegularPages "Section" "blog" }}
      {{ partial "index-row.html" . }}
      {{ end }}
    </div>
  </div>

  <aside class="sidebar">{{ partial "blog-nav" . }}</aside>
</div>
{{ end }}
