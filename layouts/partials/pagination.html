{{ $pag := $.Paginator }}
{{ if gt $pag.TotalPages 1 }}
<nav aria-label="page navigation" class="d-flex justify-content-between my-4">
  {{ if $pag.HasPrev }}
  <a href="{{ $pag.Prev.URL }}" rel="prev" class="text-decoration-none">&larr; Newer posts</a>
  {{ else }}
  <span></span>
  {{ end }}
  {{ if $pag.HasNext }}
  <a href="{{ $pag.Next.URL }}" rel="next" class="text-decoration-none">Older posts &rarr;</a>
  {{ end }}
</nav>
{{ end }}
